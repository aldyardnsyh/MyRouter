name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web assets (required for go:embed)
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Go vet + tests (serial, linker-safe)
        run: go test -count=1 -p 1 ./...
  web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install
        run: npm --prefix web ci --no-audit --no-fund
      - name: Web build assets
        run: npm --prefix web run build

  release:
    needs: [test, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build desktop binary
        shell: pwsh
        run: |
          npm --prefix web ci --no-audit --no-fund
          .\scripts\build-windows.ps1 -Gui -NoDesktopShortcut
      - name: Persist bumped version
        shell: pwsh
        run: |
          # build-windows.ps1 bumps VERSION in the runner before building. If the
          # bump is not committed back, every run recomputes the same patch from
          # the stale repo value, the tag already exists, and the release is
          # silently overwritten instead of published as a new version.
          $v = (Get-Content VERSION -Raw).Trim()
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "VERSION unchanged ($v)"
            exit 0
          }
          git commit -m "chore(release): v$v [skip ci]"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::could not push the VERSION bump; the next run recomputes it"
          }
          exit 0
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
          $commits = git log --oneline "$(git describe --tags --abbrev=0 2>$null)..HEAD" 2>$null
          if (-not $commits) { $commits = git log --oneline -10 }
          $notes = "## What's changed`n`n" + (($commits | ForEach-Object { "- $_" }) -join "`n")
          $notes | Out-File -FilePath release-notes.md -Encoding utf8
          $hash = (Get-FileHash dist/MyRouter.exe -Algorithm SHA256).Hash.ToLower()
          "`n`n**SHA256:** ``$hash``" | Out-File -FilePath release-notes.md -Append -Encoding utf8
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: main
          body_path: release-notes.md
          files: dist/MyRouter.exe
